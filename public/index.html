<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Chat App</title>
    <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="centered-form">
      <div class="centered-form__box">
        <h1>Join</h1>
        <form action="chat.html">
          <label>Display name</label>
          <input type="text" name="username" placeholder="Display name" required />

          <label>Room</label>
          <select name="room">
            <option value="">Pick a room</option>
            <option value="js">JavaScript</option>
            <option value="css">CSS</option>
            <option value="html">HTML</option>
            <option value="frontend-jobs">Frontend Jobs</option>
            <option value="backend-jobs">Backend Jobs</option>
            <option value="fullstack-jobs">Full Stack Jobs</option>
            <option value="mobile-jobs">Mobile Jobs</option>
            <option value="devops-jobs">DevOps &amp; SRE Jobs</option>
            <option value="data-jobs">Data &amp; ML Jobs</option>
            <option value="security-jobs">Security Jobs</option>
            <option value="remote-jobs">Remote Jobs</option>
            <option value="contract-jobs">Contract &amp; Freelance</option>
            <option value="interviews">Interviews &amp; LeetCode</option>
            <option value="job-hunt">Job Hunt Check-ins</option>
            <option value="salary">Salary &amp; Negotiation</option>
          </select>

          <button>Join</button>
        </form>
      </div>
    </div>
  </body>
</html>
