<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Chat App</title>
    <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="status" class="status" hidden></div>

    <div class="chat">
      <div id="sidebar" class="chat__sidebar"></div>

      <div class="chat__main">
        <header class="topbar">
          <button
            id="menu-toggle"
            class="icon-button icon-button--ghost"
            type="button"
            aria-label="Toggle sidebar"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <span id="room-title" class="topbar__room"></span>
        </header>

        <div
          id="messages"
          class="chat__messages"
          role="log"
          aria-live="polite"
          aria-label="Messages"
        >
          <div id="thread" class="thread"></div>
          <div id="typing" class="typing" role="status" aria-live="polite" hidden></div>
        </div>

        <div class="compose">
          <form id="message-form">
            <input
              type="text"
              name="message"
              placeholder="Message"
              required
              autocomplete="off"
              aria-label="Message"
            />
            <button class="icon-button" type="submit" aria-label="Send message">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 19V5" />
                <path d="m5 12 7-7 7 7" />
              </svg>
            </button>
          </form>
        </div>
      </div>

      <div id="scrim" class="scrim"></div>
    </div>

    <script id="message-template" type="text/html">
      <article class="msg{{#own}} msg--own{{/own}}{{#grouped}} msg--grouped{{/grouped}}">
        <div class="avatar msg__avatar" style="--hue: {{ hue }}" aria-hidden="true">
          {{ initials }}
        </div>
        <div class="msg__body">
          <div class="msg__head">
            {{^own}}
            <span class="msg__name">{{ username }}</span>
            {{/own}}
            <time class="msg__time">{{ createdAt }}</time>
          </div>
          <div class="msg__text">{{ message }}</div>
        </div>
      </article>
    </script>

    <script id="system-template" type="text/html">
      <div class="sys">{{ message }}</div>
    </script>

    <script id="sidebar-template" type="text/html">
      <div class="rail__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3 14 9.2 20.2 11 14 12.8 12 19 10 12.8 3.8 11 10 9.2 12 3Z" />
        </svg>
      </div>
      <div class="rail__room" title="Room: {{ room }}"><span>{{ initial }}</span></div>
      <ul class="rail__users" title="{{ count }} online" aria-label="Users in room">
        {{#users}}
        <li>
          <div class="avatar" style="--hue: {{ hue }}" title="{{ username }}">{{ initials }}</div>
        </li>
        {{/users}}
      </ul>
      <div class="spacer"></div>
      <a class="rail__leave" href="/" title="Leave Room" aria-label="Leave room">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 5l-7 7 7 7" />
          <path d="M9 12h10" />
        </svg>
      </a>
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.0.1/mustache.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.6.0/qs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
